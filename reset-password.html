<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#1c3340">
    <meta name="description" content="Defina uma nova senha da Library Jashin.">
    <title>Nova senha — Library Jashin</title>
    <link rel="icon" href="icon.png" type="image/png">
    <link rel="stylesheet" href="styles.css">
    <style>
        .login-page{min-height:100vh;display:flex;flex-direction:column}.login-wrapper{flex:1;display:grid;place-items:center;padding:30px 16px}.login-card{width:min(100%,440px);background:rgba(255,248,230,.96);border:1px solid #d7c79f;border-radius:14px;padding:30px;box-shadow:0 10px 30px #594a2925}.login-logo{text-align:center;margin-bottom:24px}.login-logo img{width:76px;height:76px;border-radius:50%;object-fit:cover;border:3px solid var(--gold)}.login-logo h1{margin:14px 0 4px;font:700 28px Georgia,serif;color:var(--night)}.login-logo p,.login-card>p{margin:0;color:var(--muted);font-size:13px}.form-group{margin-bottom:16px}.form-group label{display:block;font-weight:700;font-size:14px;margin-bottom:6px}.form-group input{margin:0}.login-btn{width:100%;margin-top:4px}.login-message{display:none;margin-bottom:16px;padding:11px 13px;border-radius:8px;font-size:13px;line-height:1.4}.login-message.show{display:block}.login-message.error{background:#f3dfe2;border:1px solid #d9aab3;color:#713945}.login-message.success{background:#dfece4;border:1px solid #aac8b7;color:#315342}.back-public{text-align:center;margin-top:20px}.back-public a{color:var(--muted);font-size:13px;text-decoration:none}
    </style>
</head>
<body class="login-page">
<header class="header"><div class="brand"><img src="icon.png" alt="Logo Library Jashin"><div><h1>Library Jashin</h1><p>Biblioteca pessoal</p></div></div></header>
<main class="login-wrapper"><section class="login-card">
    <div class="login-logo"><img src="icon.png" alt="Library Jashin"><h1>Nova senha</h1><p>Crie uma nova senha para sua conta administrativa.</p></div>
    <div id="resetMessage" class="login-message" role="alert"></div>
    <form id="resetForm" novalidate>
        <div class="form-group"><label for="newPassword">Nova senha</label><input type="password" id="newPassword" minlength="6" autocomplete="new-password" required></div>
        <div class="form-group"><label for="confirmPassword">Confirmar nova senha</label><input type="password" id="confirmPassword" minlength="6" autocomplete="new-password" required></div>
        <button type="submit" id="resetBtn" class="btn btn-primary login-btn">🔐 Salvar nova senha</button>
    </form>
    <div class="back-public"><a href="index.html">← Voltar para biblioteca pública</a></div>
</section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
const config=window.SUPABASE_CONFIG||{};
const client=window.supabase?.createClient(config.url,config.anonKey);
const form=document.getElementById('resetForm'),message=document.getElementById('resetMessage'),btn=document.getElementById('resetBtn');
function show(msg,type='error'){message.textContent=msg;message.className=`login-message show ${type}`}
function finish(){form.reset();setTimeout(()=>window.location.replace('login.html'),1800)}
if(!client) show('Não foi possível carregar a configuração do sistema.');
client?.auth.onAuthStateChange((event,session)=>{if(event==='PASSWORD_RECOVERY'&&!session)show('O link de recuperação é inválido ou expirou. Solicite outro link.');});
form.addEventListener('submit',async e=>{e.preventDefault();const p=document.getElementById('newPassword').value,c=document.getElementById('confirmPassword').value;if(p.length<6)return show('A senha precisa ter pelo menos 6 caracteres.');if(p!==c)return show('As senhas não são iguais.');btn.disabled=true;btn.textContent='Salvando...';try{const{data,error}=await client.auth.getSession();if(error||!data.session)throw new Error('O link de recuperação é inválido ou expirou. Solicite outro link.');const{error:updateError}=await client.auth.updateUser({password:p});if(updateError)throw updateError;show('Senha alterada com sucesso! Você será levado para o login.','success');await client.auth.signOut();finish()}catch(err){console.error(err);show(err.message||'Não foi possível alterar a senha.');btn.disabled=false;btn.textContent='🔐 Salvar nova senha'}});
</script>
</body>
</html>
