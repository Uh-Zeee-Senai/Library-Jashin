<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#1c3340"
    >

    <title>Nova senha — Library Jashin</title>

    <link
        rel="icon"
        href="icon.png"
        type="image/png"
    >

    <link
        rel="stylesheet"
        href="styles.css"
    >

</head>


<body class="login-page">


    <header class="header">

        <div class="brand">

            <img
                src="icon.png"
                alt="Library Jashin"
            >

            <div>

                <h1>Library Jashin</h1>

                <p>
                    Biblioteca pessoal
                </p>

            </div>

        </div>

    </header>


    <main class="login-wrapper">

        <section class="login-card">


            <div class="login-logo">

                <img
                    src="icon.png"
                    alt="Library Jashin"
                >

                <h1>
                    Nova senha
                </h1>

                <p>
                    Crie uma nova senha para sua conta.
                </p>

            </div>


            <div
                id="resetMessage"
                class="login-message"
                role="alert"
            ></div>


            <form id="resetForm">


                <div class="form-group">

                    <label for="newPassword">
                        Nova senha
                    </label>

                    <input
                        type="password"
                        id="newPassword"
                        placeholder="Digite a nova senha"
                        minlength="6"
                        autocomplete="new-password"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="confirmPassword">
                        Confirmar nova senha
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Digite novamente"
                        minlength="6"
                        autocomplete="new-password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    id="resetBtn"
                    class="btn btn-primary login-btn"
                >
                    🔐 Salvar nova senha
                </button>


            </form>


            <div class="back-public">

                <a href="index.html">
                    ← Voltar para biblioteca pública
                </a>

            </div>


        </section>

    </main>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="supabase-config.js"></script>

    <script>

        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_ANON_KEY
            );


        const resetForm =
            document.getElementById("resetForm");

        const newPassword =
            document.getElementById("newPassword");

        const confirmPassword =
            document.getElementById("confirmPassword");

        const resetBtn =
            document.getElementById("resetBtn");

        const resetMessage =
            document.getElementById("resetMessage");


        function showMessage(
            message,
            type = "error"
        ) {

            resetMessage.textContent =
                message;

            resetMessage.className =
                `login-message show ${type}`;

        }


        /*
         * O Supabase Auth processa o link recebido
         * e disponibiliza a sessão para esta página.
         */

        supabaseClient.auth.onAuthStateChange(
            (event, session) => {

                console.log(
                    "Auth event:",
                    event
                );

            }
        );


        resetForm.addEventListener(
            "submit",
            async event => {

                event.preventDefault();


                const password =
                    newPassword.value;

                const confirmation =
                    confirmPassword.value;


                if (password.length < 6) {

                    showMessage(
                        "A senha precisa ter pelo menos 6 caracteres."
                    );

                    return;

                }


                if (password !== confirmation) {

                    showMessage(
                        "As senhas não são iguais."
                    );

                    return;

                }


                resetBtn.disabled = true;

                resetBtn.textContent =
                    "Salvando...";


                try {

                    const {
                        error
                    } = await supabaseClient.auth.updateUser({
                        password: password
                    });


                    if (error) {
                        throw error;
                    }


                    showMessage(
                        "Senha alterada com sucesso! " +
                        "Você será levado para o login.",
                        "success"
                    );


                    resetForm.reset();


                    setTimeout(() => {

                        window.location.href =
                            "login.html";

                    }, 1800);


                } catch (error) {

                    console.error(
                        "Erro ao alterar senha:",
                        error
                    );


                    showMessage(
                        error.message ||
                        "Não foi possível alterar a senha."
                    );


                    resetBtn.disabled = false;

                    resetBtn.textContent =
                        "🔐 Salvar nova senha";

                }

            }
        );

    </script>

</body>

</html>
