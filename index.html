<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#2c3e50">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="description" content="Aplicativo PWA para controle de ordens de serviço">
    <title>Controle de Ordens de Serviço</title>
    <link rel="icon" href="icon.png" type="image/png">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">

        <header class="header">
            <h1>Controle de Ordens de Serviço</h1>
            <button id="installBtn" class="btn install-btn" hidden>Instalar</button>
        </header>

        <section id="botaoNovaOrdemSection" class="section">
            <button class="btn btn-large btn-success" onclick="toggleFormSection()">
            ➕ Nova Ordem de Serviço
            </button>
        </section>

        <section id="formSection" class="section form-section">
            <h2>Nova Ordem de Serviço</h2>
            <form id="ordemServicoForm">
                <div class="form-group">
                    <label for="numeroOrdem">Número da OS</label>
                    <input type="text" id="numeroOrdem" placeholder="Ex: OS-001" required autocomplete="off">
                </div>
                <div class="form-group">
                    <label for="solicitante">Solicitante</label>
                    <input type="text" id="solicitante" placeholder="Nome do solicitante" required autocomplete="off">
                </div>
                <div class="form-group">
                    <label for="descricao">Descrição do serviço</label>
                    <input type="text" id="descricao" placeholder="Descreva o serviço solicitado..." required autocomplete="off">
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Salvar</button>
                    <button type="button" class="btn btn-secondary" onclick="toggleFormSection()">Cancelar</button>
                </div>
            </form>
        </section>

        <section class="section list-section">
            <h2>Ordens de Serviço</h2>
            <div id="ordemServicoList" class="ordem-servico-list">
                <p class="empty-message">Nenhuma ordem de serviço registrada.</p>
            </div>
        </section>

    </div>

    <footer class="footer">
        <p>Controle de Ordens de Serviço</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="app.js"></script>
</body>
</html>
